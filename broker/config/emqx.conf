node.data_dir = "/opt/emqx/data"
cluster.discovery_strategy = manual
listeners.tcp.default {
  bind = "0.0.0.0:1883"
  enable_authn = true
  max_connections = 1024
}
listeners.ssl.default.enable = false
listeners.ws.default.enable = false
listeners.wss.default.enable = false
dashboard.listeners.http.bind = 18083
authentication = [{
  mechanism = password_based
  backend = built_in_database
  user_id_type = username
  password_hash_algorithm { name = sha256, salt_position = suffix }
  bootstrap_file = "/opt/emqx/etc/argos-users.json"
  bootstrap_type = plain
}]
authorization {
  no_match = deny
  deny_action = disconnect
  cache.enable = false
  sources = [{ type = file, enable = true, path = "/opt/emqx/etc/argos-acl.conf" }]
}
mqtt {
  max_packet_size = "8KB"
  max_qos_allowed = 1
  session_expiry_interval = "7d"
}
# O assinante worker usa clean=false e sessionExpiryInterval > 0.
durable_sessions.enable = true
durable_sessions.message_retention_period = "7d"
log.console { enable = true, level = warning }

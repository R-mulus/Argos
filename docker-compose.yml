# Broker MQTT do Argos para desenvolvimento e demonstração em rede local.
# Mesma imagem do ensaio do backend (backend/tests/integracao/ensaio-terminal.ts).
#
#   docker compose up -d emqx
#
# O nome argos-emqx é o que a tarefa "Docker + EMQX" do VS Code inicia. Se já existir um container
# argos-emqx criado à mão, exporte antes usuários/ACL configurados nele: `docker compose up` não o
# substitui sozinho (remova-o com `docker rm -f argos-emqx` só depois de exportar a configuração).
#
# Portas:
# - 1883: MQTT sem TLS, para os receptores na LAN de laboratório (firmware com ARGOS_LOCAL_PLAINTEXT=1)
#   e para o worker no próprio notebook (MQTT_URL=mqtt://127.0.0.1:1883 com MQTT_ALLOW_INSECURE_LOCAL=true).
# - 8883: MQTT com TLS. Exige certificado configurado no EMQX; é o modo previsto em firmware/README.md.
# - 18083: painel do EMQX, publicado apenas no próprio computador.
# Autenticação, ACL por receptor e certificados são configurados no painel: veja firmware/README.md.
services:
  emqx:
    image: emqx/emqx-enterprise:6.3.2
    container_name: argos-emqx
    restart: unless-stopped
    ports:
      - "1883:1883"
      - "8883:8883"
      - "127.0.0.1:18083:18083"
    volumes:
      # Sessões persistentes e mensagens QoS 1 sobrevivem a reinícios do container.
      - emqx-data:/opt/emqx/data
      - emqx-log:/opt/emqx/log
    healthcheck:
      test: ["CMD", "emqx", "ctl", "status"]
      interval: 10s
      timeout: 5s
      retries: 12

volumes:
  emqx-data:
  emqx-log:

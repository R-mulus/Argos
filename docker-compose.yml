# Desenvolvimento somente: TCP exige o perfil explícito mqtt-local.
# Base comparada com origin/dev; não substitui containers/volumes preexistentes.
services:
  emqx:
    profiles: [mqtt-local]
    image: emqx/emqx-enterprise:6.3.2
    restart: unless-stopped
    ports:
      - "${ARGOS_MQTT_BIND:-127.0.0.1}:${ARGOS_MQTT_PORT:-1883}:1883"
      - "127.0.0.1:${ARGOS_EMQX_DASHBOARD_PORT:-18083}:18083"
    volumes:
      - emqx-data:/opt/emqx/data
      - emqx-log:/opt/emqx/log
      - ./infra/emqx/emqx.conf:/opt/emqx/etc/base.hocon:ro
      - ./infra/emqx/acl.conf:/opt/emqx/etc/argos-acl.conf:ro
      - ./infra/emqx/users.local.csv:/opt/emqx/etc/argos-users.csv:ro
    healthcheck:
      test: [CMD, emqx, ctl, status]
      interval: 10s
      timeout: 5s
      retries: 12
volumes:
  emqx-data:
  emqx-log:

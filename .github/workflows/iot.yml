name: IoT e firmware
on:
  push:
    branches: [backend-iot]
  pull_request:
    paths: ['iot/**', 'firmware/**', 'supabase/**', '.github/workflows/iot.yml']
permissions:
  contents: read
jobs:
  python:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_PASSWORD: local_test_only
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready --health-interval 5s
          --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r iot/requirements.txt pytest
      - name: Preparar banco descartável
        env:
          PGPASSWORD: local_test_only
        run: |
          psql -h localhost -U postgres -v ON_ERROR_STOP=1 -f iot/tests/bootstrap_postgres.sql
          for migration in supabase/migrations/*.sql; do
            psql -h localhost -U postgres -v ON_ERROR_STOP=1 -f "$migration"
          done
      - run: python -m pytest -q
        working-directory: iot
        env:
          ARGOS_TEST_DATABASE_URL: postgresql://postgres:local_test_only@localhost:5432/postgres
  firmware:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - board: esp32c3
            sketch: ArgosTransmissor
          - board: esp32s3
            sketch: ArgosReceptor
          - board: esp32
            sketch: ArgosReceptor
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: arduino/setup-arduino-cli@v2
      - run: |
          arduino-cli core update-index --additional-urls https://espressif.github.io/arduino-esp32/package_esp32_index.json
          arduino-cli core install esp32:esp32@3.0.7 --additional-urls https://espressif.github.io/arduino-esp32/package_esp32_index.json
          arduino-cli lib install 'ArduinoMqttClient@0.1.8' 'ArduinoJson@7.4.2' 'Adafruit SSD1306@2.5.15'
          python3 -m pip install pyserial
      - run: arduino-cli compile --fqbn esp32:esp32:${{ matrix.board }} --libraries firmware/libraries firmware/${{ matrix.sketch }}

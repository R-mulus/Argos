name: Backend API

on:
  push:
    branches:
      - 'feat/backend-*'
  pull_request:
    paths:
      - 'backend/**'
      - 'supabase/**'
      - 'pnpm-lock.yaml'
      - '.github/workflows/backend.yml'

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 12.11.2
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: pnpm
      - run: pnpm install --no-frozen-lockfile
      - name: Emit lockfile for integration
        run: |
          echo "ARGOS_LOCK_BEGIN"
          base64 -w 2000 pnpm-lock.yaml
          echo
          echo "ARGOS_LOCK_END"
      - run: pnpm --dir backend typecheck
      - run: pnpm --dir backend test
